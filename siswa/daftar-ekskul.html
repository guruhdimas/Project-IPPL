    <nav class="sidebar__nav">
      <p class="sidebar__label">Menu Utama</p>
      <a class="nav-item" href="dashboard-siswa.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a class="nav-item is-active" href="daftar-ekskul.html">

        Daftar Ekskul

      <a class="nav-item" href="jadwal.html">

        Jadwal

      <a class="nav-item" href="tugas.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        Tugas
      </a>
      <a class="nav-item" href="absensi.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>

        Penilaian

    <div class="sidebar__foot">

        Keluar

    </div>

  <!-- ===== KONTEN ===== -->
  <div class="main">
    <header class="header">
      <div class="header__left">
        <button class="menu-btn" id="menuBtn" aria-label="Buka menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="header__title">Daftar Ekskul</h1>
      </div>
      <div class="header__right">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" placeholder="Cari Pengumuman, Tugas..." aria-label="Cari" />
        </div>
        <a class="user" href="profil.html">
          <div class="user__avatar">BS</div>
          <div>
            <p class="user__name">Budi Setiawan</p>
            <p class="user__class">Kelas XI IPA 2</p>
          </div>
        </a>
      </div>
    </header>

    <div class="content">
      <div class="content__body">

        <div class="page-head">
          <h2>Daftar Ekstrakurikuler</h2>
          <p>Lihat pembimbing, kuota, dan status pendaftaran</p>
        </div>

        <section class="panel">
          <!-- Pencarian & filter -->
          <div class="toolbar">
            <div class="toolbar__search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="q" type="search" placeholder="Cari Ekstrakurikuler…" aria-label="Cari ekstrakurikuler" />
            </div>
            <div class="toolbar__select">
              <select id="status" aria-label="Filter status">
                <option value="">Semua status</option>
                <option value="dibuka">Dibuka</option>
                <option value="penuh">Penuh</option>
              </select>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <button class="btn-reset" id="reset" type="button">Reset</button>
          </div>

          <!-- Kartu ekskul (diisi oleh JavaScript di bawah) -->
          <div class="ekskul-grid" id="grid" aria-live="polite"></div>
        </section>
      </div>

      <p class="footer-note">Portal Ekstrakurikuler © 2026 · SMA Trisula Praja</p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Buka/tutup sidebar di layar kecil
  var sidebar = document.getElementById('sidebar');
  document.getElementById('menuBtn').addEventListener('click', function () { sidebar.classList.toggle('is-open'); });
  document.querySelector('.main').addEventListener('click', function () { sidebar.classList.remove('is-open'); });

  var grid = document.getElementById('grid');
  var q = document.getElementById('q');
  var filterStatus = document.getElementById('status');
  var EKSKUL = [];   // diisi dari database lewat api/ekskul.php

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var kata = q.value.trim().toLowerCase();
    var filter = filterStatus.value;

    var hasil = EKSKUL.filter(function (e) {
      var penuh = e.terisi >= e.kuota;
      var cocokKata = !kata || (e.nama + ' ' + e.pembimbing).toLowerCase().indexOf(kata) !== -1;
      var cocokStatus = !filter || (filter === 'penuh') === penuh;
      return cocokKata && cocokStatus;
    });

    if (!hasil.length) {
      grid.innerHTML = '<p class="empty">Tidak ada ekstrakurikuler yang cocok.</p>';
      return;
    }

    grid.innerHTML = hasil.map(function (e) {
      var penuh = e.terisi >= e.kuota;
      var persen = Math.min(100, (e.terisi / e.kuota) * 100);
      var st = e.pendaftaran ? e.pendaftaran.status : null;
      var detail = 'detail-ekskul.html?id=' + encodeURIComponent(e.id);
      var aksi;
      if (st === 'Disetujui') aksi = '<div class="reg-status"><a class="reg-badge reg-badge--ok" href="' + detail + '">Disetujui</a></div>';
      else if (st === 'Menunggu') aksi = '<div class="reg-status"><a class="reg-badge reg-badge--wait" href="' + detail + '">Menunggu</a></div>';
      else if (st === 'Ditolak') aksi = '<div class="reg-status"><a class="reg-badge reg-badge--no" href="' + detail + '">Ditolak</a></div>';
      else aksi = '<a class="btn-join" href="pendaftaran-ekskul.html?id=' + encodeURIComponent(e.id) + '"' +
            (penuh ? ' aria-disabled="true" tabindex="-1"' : '') + '>Daftar Sekarang</a>';
      return '' +
        '<article class="ekskul-card">' +
          '<div class="ekskul-card__top">' +
            '<h3 class="ekskul-card__name">' + esc(e.nama) + '</h3>' +
            '<span class="status' + (penuh ? ' status--full' : '') + '">' + (penuh ? 'Penuh' : 'Dibuka') + '</span>' +
          '</div>' +
          '<div class="ekskul-card__info">' +
            '<p>Pembimbing: <b>' + esc(e.pembimbing) + '</b></p>' +
            '<p>Jadwal: <b>' + esc(e.jadwal) + '</b></p>' +
          '</div>' +
          '<div class="quota"><span>Kuota</span><strong>' + e.terisi + '/' + e.kuota + '</strong></div>' +
          '<div class="bar"><div class="bar__fill" style="width:' + persen + '%"></div></div>' +
          aksi +
        '</article>';
    }).join('');
  }

  q.addEventListener('input', render);
  filterStatus.addEventListener('change', render);
  document.getElementById('reset').addEventListener('click', function () {
    q.value = '';
    filterStatus.value = '';
    render();
  });

  grid.innerHTML = '<p class="empty">Memuat data…</p>';
  API.semuaEkskul().then(function (res) {
    EKSKUL = res.ekskul;
    render();
  }).catch(function (err) {
    grid.innerHTML = '<p class="empty">' + esc(err.message) + '</p>';
  });
</script>
</body>
</html>
