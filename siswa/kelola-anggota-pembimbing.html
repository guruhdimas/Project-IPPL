<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelola Anggota · Pembimbing | Portal Ekstrakurikuler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500&family=Carlito:wght@400;700&family=Concert+One&family=Inter:wght@400;600;800&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pb-layout.css">
<style>
:root{--g:#013020;--g2:#0f5132;--bd:#999;--mut:#757575;--tx:#928787;--sans:'Open Sans','Noto Sans',sans-serif;--cal:Calibri,Carlito,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:#f7f9fb;font-family:var(--cal);color:#000;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}


/* Topbar & layout */
/* jarak & lebar #app diatur oleh .pb-page di css/pb-layout.css */

/* Cards */
.panel{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:32px}
.panel-h{background:var(--g);color:#fff;padding:0 24px;min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.panel-h.sm{min-height:76px}
.panel-h h2{font:700 16px var(--sans)}
.panel-h p{font:700 14px var(--sans);color:#fff5f5;margin-top:6px}
.panel-h.sm h2{font:700 16px var(--cal)}
.panel-h.sm p{font:400 16px var(--cal);color:#fff;margin-top:2px}
.panel-b{padding:36px 24px 40px}
.back{color:#fff;font:400 13px var(--cal);text-decoration:underline}

.toolbar{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.in,.sel select{height:35px;border:1px solid var(--bd);border-radius:14px;background:#fff;padding:0 16px;font:700 14px var(--sans);outline:0}
.in::placeholder{color:var(--mut)}
.in:focus,.sel select:focus{border-color:var(--g2)}
.in.grow{flex:1;min-width:200px}
.sel{position:relative;width:201px}
.sel select{width:100%;appearance:none;text-align:center;text-align-last:center;font-weight:400;cursor:pointer}
.sel img,.sel svg{position:absolute;left:40px;top:7px;width:20px;height:20px;pointer-events:none}
.sel.k{width:166px}.sel.k select{padding-left:34px}
.btn-reset{width:132px;height:35px;border:1px solid var(--bd);border-radius:14px;background:#fff;font:700 14px var(--sans)}
.btn-reset:hover{background:#f3f4f6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:24px}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(315px,1fr))}
.card{border:1px solid var(--bd);border-radius:14px;padding:18px 18px 12px;display:flex;flex-direction:column;min-height:149px;position:relative}
.grid.w .card{min-height:205px}
.card h3{font:700 14px var(--sans);margin-bottom:6px}
.card .d{font:400 12px/1.35 var(--cal);color:var(--tx);text-align:justify}
.card .meta{font:400 12px var(--cal);color:var(--tx);margin-top:6px}
.card .meta b{font-weight:400;color:#000}
.pill{align-self:flex-end;margin-top:auto;height:17px;padding:0 14px;border-radius:12px;background:#d9d9d9;font:400 12px/17px var(--cal)}
.card .pill{align-self:flex-start}
.card:not(.w) .pill{align-self:flex-end}
.pill:hover{background:#c4c4c4}
.status{position:absolute;right:12px;top:10px;height:12px;padding:0 8px;border-radius:14px;background:#90d0e8;font:700 8px/12px var(--sans);color:var(--mut);display:flex;align-items:center;gap:4px}
.status i{width:5px;height:5px;border-radius:50%;background:var(--mut)}
.status.off{background:#f3c0c0}
.card .kq{display:flex;justify-content:space-between;font:400 12px var(--cal);color:var(--tx);margin-top:10px}
.card .kq b{font-weight:400;color:#000}
.bar{height:3px;background:#d9d9d9;margin:3px 0 12px}
.bar i{display:block;height:100%;background:#397c40}
.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mut);font:700 14px var(--sans);background:none}
.add:hover{background:#f9fafb}
.empty{padding:28px;text-align:center;color:var(--mut);font:400 14px var(--sans)}

/* Tabs */
.tabs{display:inline-flex;gap:8px;padding:7px 8px;background:#fff;border-radius:14px;margin-bottom:46px}
.tabs button{height:28px;padding:0 16px;border-radius:10px;font:400 16px var(--cal)}
.tabs button.on{background:#f9e470}

/* Kuota in header */
.kuota{width:281px;color:#fff;font:400 12px var(--cal)}
.kuota div{display:flex;justify-content:space-between}
.kuota .bar{margin:2px 0 0}
.head-l{display:flex;align-items:center;gap:80px;flex-wrap:wrap}
.btn-all{display:flex;align-items:center;gap:12px;height:48px;padding:0 24px;border-radius:12px;background:#999;color:#fff;font:400 16px var(--cal)}
.btn-all img,.btn-all svg{width:20px;height:20px}
.btn-all:hover:not(:disabled){background:var(--g2)}
.btn-all:disabled{opacity:.5;cursor:not-allowed}

/* Table */
.tbl-w{margin:0 13px;border:1px solid var(--mut);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font:400 14px var(--sans);min-width:760px}
th{background:#e8f5e9;color:#004029;font-weight:400;text-align:center;padding:12px 16px;white-space:nowrap}
td{padding:14px 16px;text-align:center;color:#615f5f;border-top:1px solid var(--mut)}
th:first-child,td:first-child{text-align:left;padding-left:36px}
td:first-child{color:#000;font-weight:700}
.late{color:red}
.st{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.w{color:#d97706}.st.a{color:#12aad4}.st.r{color:#dc2626}
.acts{display:flex;gap:10px;justify-content:center}
.b{height:25px;min-width:76px;padding:0 10px;border-radius:14px;border:1px solid var(--mut);font:400 14px/23px var(--cal)}
.b.ok{background:var(--g2);border-color:var(--g2);color:#fff}
.b.ok:hover{background:#0b3d27}.b:not(.ok):hover{background:#f3f4f6}
.tbl-pad{padding:0 12px 24px}

/* Tampilan 'Pilih Ekstrakurikuler' mengikuti Figma */
.panel-b.fig{padding:51px 24px 72px}
.toolbar.fig{gap:35px;margin-bottom:21px}
.toolbar.fig .in.grow{flex:0 1 600px;min-width:200px;padding-left:38px}
.grid.fig{grid-template-columns:repeat(auto-fill,206px);gap:21px 24px}
.grid.fig .card{padding:20px 24px 13px 17px}
.grid.fig .card h3{line-height:1;margin-bottom:5px}
.grid.fig .card .d{line-height:1.2}
.grid.fig .pill{width:88px;padding:0;text-align:center}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.ov.on{display:flex}
.dlg{width:512px;max-width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);font-family:Inter,sans-serif}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #e2e8f0}
.dlg-h h3{font:600 16px/24px Inter,sans-serif;color:#0f172a}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}.x:hover{background:#f1f5f9}
.dlg-b{padding:24px}
.who2{display:flex;align-items:center;gap:16px}
.av{width:56px;height:56px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font:600 18px Inter,sans-serif}
.who2 b{display:block;font:600 18px/28px Inter,sans-serif;color:#0f172a}
.who2 span{font:400 14px/20px Inter,sans-serif;color:#64748b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stats div{background:#e8f5e9;border-radius:8px;padding:12px}
.stats small{display:block;font-size:12px;line-height:16px;color:#64748b}
.stats strong{display:block;margin-top:4px;font:600 14px/20px Inter,sans-serif;color:#0f172a}
.dlg-f{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;background:#f8fafc;border-top:1px solid #e2e8f0}
.dlg-f button{height:40px;border-radius:8px;border:1px solid #e2e8f0;font:600 14px Inter,sans-serif}
.dlg-f .out{width:100px;background:#f9b8b8;color:#dc2626;font-weight:800}.dlg-f .out:hover{background:#f5a0a0}
.dlg-f .cl{padding:0 16px;background:#fff;color:#0f172a}.dlg-f .cl:hover{background:#f1f5f9}


@media(max-width:900px){
 .head-l{gap:16px}
}
</style>
</head>
<body>

<aside id="pb-sidebar" data-active="kelola"></aside>

<div class="pb-main">
  <header id="pb-topbar"></header>
  <main id="app" class="pb-page"></main>
  <div id="pb-foot"></div>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dlg" id="dlg"></div>
</div>

<script src="js/pb-layout-v2.js"></script>
<script>
/* Tambalan: pastikan menu Tugas, Absensi, Pengumuman & Penilaian selalu menuju halamannya, apa pun versi pb-layout.js yang termuat */
(function(){
  var map={tugas:'tugas-pembimbing.html',absensi:'absensi-pembimbing.html',pengumuman:'pengumuman-pembimbing.html',penilaian:'indeks-penilaian-pembimbing.html'};
  Object.keys(map).forEach(function(k){
    var a=document.querySelector('#pb-sidebar a[data-k="'+k+'"]');
    if(a){a.setAttribute('href',map[k]);a.removeAttribute('data-soon');}
  });
})();
</script>
<script>
/* ---------- Data ---------- */
const PEMBIMBING = 'Abdul Husein, S.T';
const EKSKUL = [
  {id:'robotic', nama:'Robotic', kuota:30, jadwal:'Rabu 14.00', desc:'Merakit robot, mempelajari sensor, mikrokontroler, Internet of Things, dan mengikuti kompetisi teknologi.'},
  {id:'cyber', nama:'Cyber', kuota:30, jadwal:'Belum dijadwalkan', desc:'Belajar pemrograman, jaringan komputer, keamanan digital, pengembangan website, dan kompetisi Capture the Flag secara legal.'},
  {id:'english', nama:'English Club', kuota:30, jadwal:'Belum dijadwalkan', desc:'Melatih cara berkomunikasi, argumentasi, presentasi, dan kemampuan berbahasa Inggris.'},
  {id:'science', nama:'Science Research Club', kuota:30, jadwal:'Belum dijadwalkan', desc:'Mengembangkan penelitian, eksperimen, karya ilmiah, dan inovasi untuk kompetisi sains.'},
  {id:'seni', nama:'Seni Dan Budaya', kuota:30, jadwal:'Belum dijadwalkan', desc:'Mengembangkan bakat tari tradisional, musik, teater, dan pelestarian budaya Indonesia.'},
  {id:'basket', nama:'Basket Dan Futsal', kuota:30, jadwal:'Belum dijadwalkan', desc:'Membangun kebugaran, kerja sama tim, kedisiplinan, dan kemampuan berkompetisi.'}
];
const m = (id,nama,kelas,status,join) => ({id,nama,kelas,ekskul:'robotic',deadline:'10 Okt 2026',status,join,hadir:'100%',tugas:1});
let MEMBERS = [
  m(1,'Dimas Saputra','XII IPA 2','menunggu'),
  m(2,'Agus Santoso','XII IPA 1','menunggu'),
  m(3,'Rahayu Dwi Kartika','XI IPS 1','menunggu'),
  m(4,'Dwi Kartika','XII IPA 3','aktif','10 Februari 2025'),
  m(5,'Randi Rahmat','XII IPA 2','aktif','10 Februari 2025'),
  m(6,'Wahyu Firmawan','XI IPS 2','aktif','10 Februari 2025')
];

/* ---------- State ---------- */
const S = {view:'pilih', tab:'verifikasi', diampu:[], eid:null, q:'', pick:'', kelas:'', status:'menunggu'};

/* Status disimpan di browser: siapa mengampu ekskul apa + data anggota, supaya sama di semua jalur masuk halaman */
const KEY = 'kelola-anggota-pembimbing-v2';
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && Array.isArray(s.diampu) && Array.isArray(s.members)) { S.diampu = s.diampu; MEMBERS = s.members; }
} catch (_) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({diampu:S.diampu, members:MEMBERS})); } catch (_) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ekskul = id => EKSKUL.find(e => e.id === id);
const terisi = id => MEMBERS.filter(x => x.ekskul === id && (x.status === 'menunggu' || x.status === 'aktif')).length;
const initials = n => n.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
const resetFilter = () => { S.q=''; S.pick=''; S.kelas=''; S.status='menunggu'; };

/* ---------- Views ---------- */
function toolbar(opts, withReset=true){
  return `<div class="toolbar${withReset?'':' fig'}">
    <input class="in grow" data-f="q" placeholder="Cari Ekstrakurikuler ..." value="${esc(S.q)}">
    <div class="sel"><select data-f="pick"><option value="">Semua Ekskul</option>${opts.map(e=>`<option value="${e.id}" ${S.pick===e.id?'selected':''}>${esc(e.nama)}</option>`).join('')}</select></div>
    ${withReset?'<button class="btn-reset" data-act="reset">Reset</button>':''}
  </div>`;
}
const filterEk = list => list.filter(e => (!S.pick || e.id===S.pick) && e.nama.toLowerCase().includes(S.q.toLowerCase()));

function viewPilih(){
  const avail = EKSKUL;
  const list = filterEk(avail);
  return `<section class="panel">
    <div class="panel-h"><div><h2>Kelola Ekstrakurikuler</h2><p>Pilih Ekstrakurikuler Yang Ingin Di ampu</p></div>
      ${S.diampu.length?'<button class="back" data-act="back">Lihat yang diampu →</button>':''}</div>
    <div class="panel-b fig">${toolbar(avail,false)}
      ${list.length?`<div class="grid fig">${list.map(e=>`<div class="card"><h3>${esc(e.nama)}</h3><p class="d">${esc(e.desc)}</p>${S.diampu.includes(e.id)?`<button class="pill" data-act="kelola" data-id="${e.id}">Kelola Anggota</button>`:`<button class="pill" data-act="ampu" data-id="${e.id}">Ampu Ekskul</button>`}</div>`).join('')}</div>`
      :'<div class="empty">Tidak ada ekstrakurikuler yang tersedia.</div>'}
    </div></section>`;
}

function viewEkskul(){
  const mine = EKSKUL.filter(e => S.diampu.includes(e.id));
  const list = filterEk(mine);
  return `<section class="panel">
    <div class="panel-h"><div><h2>Kelola Ekstrakurikuler</h2><p>Verifikasi Pendaftar, Dan Kelola Anggota</p></div></div>
    <div class="panel-b">${toolbar(mine)}
      <div class="grid w">${list.map(e=>{
        const t = terisi(e.id), open = t < e.kuota;
        return `<div class="card"><h3>${esc(e.nama)}</h3>
          <span class="status ${open?'':'off'}"><i></i>${open?'Di Buka':'Penuh'}</span>
          <p class="d">${esc(e.desc)}</p>
          <p class="meta">Pembimbing: <b>${PEMBIMBING}</b></p>
          <p class="meta" style="margin-top:2px">Jadwal: <b>${esc(e.jadwal)}</b></p>
          <div class="kq"><span>Kuota</span><b>${t}/${e.kuota}</b></div>
          <div class="bar"><i style="width:${Math.min(100,t/e.kuota*100)}%"></i></div>
          <button class="pill" data-act="kelola" data-id="${e.id}">Kelola Anggota</button></div>`;}).join('')}
        ${S.diampu.length < EKSKUL.length && !S.q && !S.pick ? '<button class="card add" data-act="back-pick">+ Ampu Ekskul Lain</button>' : ''}
      </div>
      ${!list.length?'<div class="empty">Ekstrakurikuler tidak ditemukan.</div>':''}
    </div></section>`;
}

function viewAnggota(){
  const e = ekskul(S.eid), all = MEMBERS.filter(x => x.ekskul === e.id);
  const ver = S.tab === 'verifikasi';
  const base = ver ? all.filter(x => x.status==='menunggu' || x.status==='ditolak') : all.filter(x => x.status==='aktif');
  const kelasOpt = [...new Set(base.map(x => x.kelas))].sort();
  const rows = base.filter(x =>
    x.nama.toLowerCase().includes(S.q.toLowerCase()) &&
    (!S.kelas || x.kelas === S.kelas) &&
    (!ver || S.status==='semua' || x.status === S.status));
  const pending = all.filter(x => x.status==='menunggu').length;
  const t = terisi(e.id);
  const kuota = `<div class="kuota"><div><span>Kuota</span><span>${t}/${e.kuota}</span></div><div class="bar"><i style="width:${Math.min(100,t/e.kuota*100)}%;background:#397c40"></i></div></div>`;

  const head = ver
    ? `<div class="panel-h sm"><div class="head-l"><div><h2>Verifikasi Pendaftaran</h2><p>Terima Atau Tolak Pendaftar</p></div>${kuota}</div>
        <button class="btn-all" data-act="terima-semua" ${pending?'':'disabled'}><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10.500 4 4 8-9"/></svg>Terima Semua (${pending})</button></div>`
    : `<div class="panel-h sm"><div class="head-l"><div><h2>Anggota Aktif Ekstrakurikuler</h2><p>Kelola Anggota Ekskul</p></div>${kuota}</div></div>`;

  const tb = `<div class="toolbar" style="padding:24px 41px 0;margin:0">
    <input class="in grow" data-f="q" placeholder="Cari Nama Siswa ..." value="${esc(S.q)}">
    <div class="sel k"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false" fill="#000"><path d="M3 4h14l-5.500 6.500V16l-3-1.500v-4z"/></svg><select data-f="kelas"><option value="">Kelas</option>${kelasOpt.map(k=>`<option ${S.kelas===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>
    ${ver?`<div class="sel k"><select data-f="status" style="padding-left:16px"><option value="menunggu" ${S.status==='menunggu'?'selected':''}>Menunggu</option><option value="ditolak" ${S.status==='ditolak'?'selected':''}>Ditolak</option><option value="semua" ${S.status==='semua'?'selected':''}>Semua Status</option></select></div>`:''}
    <button class="btn-reset" data-act="reset">Reset</button></div>`;

  const stCls = {menunggu:['w','Menunggu'], aktif:['a','Aktif'], ditolak:['r','Ditolak']};
  const tr = x => `<tr><td>${esc(x.nama)}</td><td>${esc(x.kelas)}</td><td>${esc(ekskul(x.ekskul).nama)}</td>
    ${ver?`<td class="late">${esc(x.deadline)}</td>`:''}
    <td><span class="st ${stCls[x.status][0]}">${stCls[x.status][1]}</span></td>
    <td><div class="acts">${ver
      ? (x.status==='menunggu'?`<button class="b ok" data-act="terima" data-mid="${x.id}">Terima</button><button class="b" data-act="tolak" data-mid="${x.id}">Tolak</button>`:'—')
      : `<button class="b" data-act="profil" data-mid="${x.id}">Kelola</button>`}</div></td></tr>`;

  const table = `<div class="tbl-pad"><div class="tbl-w"><table><thead><tr>
    <th>NAMA SISWA</th><th>KELAS</th><th>EKSTRAKURIKULER</th>${ver?'<th>TENGGAT DAFTAR</th>':''}<th>STATUS</th><th>${ver?'AKSI':''}</th></tr></thead>
    <tbody>${rows.length?rows.map(tr).join(''):`<tr><td colspan="${ver?6:5}" class="empty" style="text-align:center">Tidak ada data.</td></tr>`}</tbody></table></div></div>`;

  return `<div class="tabs"><button class="${ver?'on':''}" data-act="tab" data-tab="verifikasi">Verifikasi</button><button class="${ver?'':'on'}" data-act="tab" data-tab="aktif">Anggota Aktif</button></div>
    <section class="panel" style="margin-bottom:32px">${head}${tb}<div style="height:20px"></div>${table}</section>`;
}

/* ---------- Render (menjaga fokus input saat mengetik) ---------- */
function render(){
  persist();
  const a = document.activeElement, f = a && a.dataset && a.dataset.f, pos = a && a.selectionStart;
  $('#app').innerHTML = S.view==='pilih' ? viewPilih() : S.view==='ekskul' ? viewEkskul() : viewAnggota();
  if (f) { const el = $(`[data-f="${f}"]`); if (el) { el.focus(); if (pos!=null && el.setSelectionRange) try{el.setSelectionRange(pos,pos)}catch(_){} } }
}

/* ---------- Toast & Modal ---------- */
let openId = null;
function openProfil(id){
  const x = MEMBERS.find(v => v.id === id); if(!x) return; openId = id;
  $('#dlg').innerHTML = `<div class="dlg-h"><h3 id="dlgT">Profil Anggota</h3>
      <button class="x" data-act="close" aria-label="Tutup"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
    <div class="dlg-b"><div class="who2"><div class="av">${esc(initials(x.nama))}</div><div><b>${esc(x.nama)}</b><span>${esc(x.kelas)} · ${esc(ekskul(x.ekskul).nama)}</span></div></div>
      <div class="stats"><div><small>Bergabung</small><strong>${esc(x.join||'-')}</strong></div><div><small>Kehadiran</small><strong>${esc(x.hadir)}</strong></div><div><small>Tugas Dikumpul</small><strong>${x.tugas}</strong></div></div></div>
    <div class="dlg-f"><button class="out" data-act="keluarkan">Keluarkan</button><button class="cl" data-act="close">Tutup</button></div>`;
  $('#ov').classList.add('on');
}
const closeProfil = () => { $('#ov').classList.remove('on'); openId = null; };

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  if (ev.target === $('#ov')) return closeProfil();
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const id = el.dataset.id, mid = +el.dataset.mid;
  switch (el.dataset.act){
    case 'ampu': S.diampu.push(id); resetFilter(); S.view='ekskul'; toast('Anda kini mengampu ' + ekskul(id).nama); break;
    case 'back': resetFilter(); S.view='ekskul'; break;
    case 'back-pick': resetFilter(); S.view='pilih'; break;
    case 'kelola': S.eid=id; S.tab='verifikasi'; resetFilter(); S.view='anggota'; break;
    case 'tab': S.tab=el.dataset.tab; resetFilter(); break;
    case 'reset': resetFilter(); break;
    case 'terima': { const x=MEMBERS.find(v=>v.id===mid); x.status='aktif'; x.join=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); x.hadir='-'; x.tugas=0; toast(x.nama+' diterima sebagai anggota'); break; }
    case 'tolak': { const x=MEMBERS.find(v=>v.id===mid); if(!confirm('Tolak pendaftaran '+x.nama+'?')) return; x.status='ditolak'; toast('Pendaftaran '+x.nama+' ditolak'); break; }
    case 'terima-semua': { const n=MEMBERS.filter(v=>v.ekskul===S.eid&&v.status==='menunggu'); if(!n.length||!confirm('Terima semua ('+n.length+') pendaftar?')) return;
      const d=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); n.forEach(x=>{x.status='aktif';x.join=d;x.hadir='-';x.tugas=0}); toast(n.length+' pendaftar diterima'); break; }
    case 'profil': openProfil(mid); return;
    case 'close': closeProfil(); return;
    case 'keluarkan': { const x=MEMBERS.find(v=>v.id===openId); if(!x||!confirm('Keluarkan '+x.nama+' dari ekskul?')) return; MEMBERS=MEMBERS.filter(v=>v!==x); closeProfil(); toast(x.nama+' dikeluarkan'); break; }
  }
  render();
});
document.addEventListener('pb:nav-active', () => { resetFilter(); S.view = 'pilih'; render(); });
document.addEventListener('input', ev => { const f = ev.target.dataset && ev.target.dataset.f; if (f){ S[f]=ev.target.value; render(); } });
document.addEventListener('keydown', ev => { if (ev.key==='Escape') closeProfil(); });

render();
</script>
</body>
</html>
