<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Penilaian - Portal Ekstrakurikuler</title>
  <script src="js/auth-siswa.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/penilaian.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar-slot"></div>
  <script src="js/sidebar.js"></script>

  <!-- ===== KONTEN ===== -->
  <div class="main">
    <header class="header">
      <div class="header__left">
        <button class="menu-btn" id="menuBtn" aria-label="Buka menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="header__title">Penilaian</h1>
      </div>
      <div class="header__right">
        <a class="user" href="profil.html">
          <div class="user__avatar">BS</div>
          <div>
            <p class="user__name">Budi Setiawan</p>
            <p class="user__class">Kelas XI IPA 2</p>
          </div>
        </a>
      </div>
    </header>

    <div class="content">
      <div class="content__body">

        <div class="page-head">
          <h2>Penilaian</h2>
          <p>Pantau dan catat capaian kompetensi per semester</p>
        </div>

        <section class="sum" aria-label="Ringkasan nilai">
          <div class="sum__card sum__card--hero">
            <p class="sum__value" id="rata">-</p>
            <p class="sum__label">Rata-rata Nilai</p>
            <div class="sum__track"><i id="rataBar" style="width:0"></i></div>
          </div>
          <div class="sum__card">
            <p class="sum__value sum__value--ok" id="baik">-</p>
            <p class="sum__label">Aspek Nilai Baik (≥80)</p>
            <p class="sum__sub" id="baikSub"></p>
          </div>
          <div class="sum__card">
            <p class="sum__value sum__value--warn" id="kurang">-</p>
            <p class="sum__label">Aspek Perlu Ditingkatkan</p>
            <p class="sum__sub">nilai di bawah 80</p>
          </div>
        </section>

        <section class="score-grid">
          <article class="panel-card panel-card--chart">
            <h3 class="panel-card__title">Grafik Capaian</h3>
            <div class="chart" id="chart"></div>
          </article>
          <article class="panel-card panel-card--detail">
            <h3 class="panel-card__title">Detail Penilaian</h3>
            <div id="detail"></div>
          </article>
        </section>
      </div>

      <p class="footer-note">Portal Ekstrakurikuler © 2026 · SMA Trisula Praja</p>
    </div>
  </div>
</div>

<script>

  // Data contoh sesuai Figma. Ganti dengan data dari server jika sudah ada backend.
  var NILAI = [
    { aspek: 'Kemandirian', predikat: 'A',  nilai: 90, catatan: 'Sangat aktif dan mandiri dalam kegiatan', periode: 'Ganjil 2026' },
    { aspek: 'Kerjasama', predikat: 'B',    nilai: 80, catatan: 'Mampu bekerja tim dengan baik',           periode: 'Ganjil 2026' },
    { aspek: 'Kedisiplinan', predikat: 'C', nilai: 75, catatan: 'Perlu meningkatkan ketepatan waktu',      periode: 'Ganjil 2026' },
    { aspek: 'Kreativitas', predikat: 'B',  nilai: 88, catatan: 'Ide-ide segar dan inovatif',              periode: 'Ganjil 2026' },
    { aspek: 'Kepemimpinan', predikat: 'B', nilai: 70, catatan: 'Perlu meningkatkan kemampuan memimpin kelompok', periode: 'Ganjil 2026' }
  ];

  var total = NILAI.reduce(function (a, n) { return a + n.nilai; }, 0);
  var rata = Math.round(total / NILAI.length);
  var baik = NILAI.filter(function (n) { return n.nilai >= 80; }).length;

  document.getElementById('rata').textContent = rata;
  document.getElementById('rataBar').style.width = rata + '%';
  document.getElementById('baik').textContent = baik;
  document.getElementById('baikSub').textContent = 'dari ' + NILAI.length + ' total aspek';
  document.getElementById('kurang').textContent = NILAI.length - baik;

  document.getElementById('chart').innerHTML = NILAI.map(function (n) {
    return '<div><div class="chart__row"><span>' + n.aspek + '</span><span><b>' + n.nilai + '</b><small>/ 100</small></span></div>' +
           '<div class="chart__bar"><i style="width:' + n.nilai + '%"></i></div></div>';
  }).join('');

  document.getElementById('detail').innerHTML = NILAI.map(function (n) {
    var p = n.predikat;
    return '<div class="detail-item"><div class="detail-item__top">' + n.aspek + '<span class="grade grade--' + p + '">' + p + '</span></div>' +
           '<p class="detail-item__note">' + n.catatan + '</p><p class="detail-item__time">' + n.periode + '</p></div>';
  }).join('');
</script>
</body>
</html>
