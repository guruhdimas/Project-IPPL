<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dasbor Pembimbing – SMA Trisula Praja</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&family=Concert+One&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9fb;--card:#fff;--line:#e5e7eb;--text:#000;--muted:#7c7c7c;--chip:#d9d9d9;--chiptx:#615f5f;--active:#70c0a0;--btn:#000;--sep:#aabfb7;--hero:#013020;--bar:#002015;--foot:#94a3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0e1512;--card:#17211c;--line:#26332c;--text:#eef3f0;--muted:#9aa8a0;--chip:#2a3830;--chiptx:#b5c0ba;--btn:#cfd8d3;--sep:#3d5247}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
#box{position:relative;width:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1440px;height:1024px;transform-origin:0 0;background:var(--bg);font-family:"Inter","Segoe UI",Arial,sans-serif}
#stage *{position:absolute}
.b{border-radius:14px}
.t{white-space:nowrap;transform:translateX(-50%);text-align:center;line-height:normal}
.c{font-family:Cabin,"Segoe UI",sans-serif}
.k{font-family:Calibri,Carlito,Cabin,sans-serif}
.o{border:1px solid var(--btn);border-radius:13px;height:26px;background:none}
.ln{height:1.5px;background:var(--sep)}
svg{fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav{cursor:pointer}
#dash *{pointer-events:auto}
#stage button{cursor:pointer}
</style>
</head>
<body>
<div id="box"><div id="stage"></div></div>

function go(n){
 document.getElementById('dash').style.display=n==0?'block':'none';

 document.getElementById('hl').style.top=(159+[0,51,107,163,219,275,335][n])+'px';
 document.getElementById('pgt').textContent=NM[n];
 document.title=NM[n]+' – SMA Trisula Praja';
}
function route(){var i=SL.indexOf((location.hash||'').slice(1));go(i<0?0:i)}
S.querySelectorAll('.nav').forEach(function(e,i){e.addEventListener('click',function(){go(i);try{location.hash=SL[i]}catch(x){}})});
document.getElementById('back').addEventListener('click',function(){go(0);try{location.hash=SL[0]}catch(x){}});
addEventListener('hashchange',route);route();
var box=document.getElementById('box');
function fit(){var k=box.clientWidth/1440;S.style.transform='scale('+k+')';box.style.height=(1024*k)+'px'}
addEventListener('resize',fit);fit();

</html>
