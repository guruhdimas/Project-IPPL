<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengumuman – Portal Ekstrakurikuler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;--bg:#f7f9fb;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--ink2:#1a2332;--muted:#64748b;--soft:#4b5563;
  --green:#023724;--green2:#0f5132;--mint:#eaf4f0;--mint2:#e8f5e9;--chip:#d1e7dd;--cell-off:#f8fafc;--cell-end:#e2e8f0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:230px;min-width:220px;background:var(--card);border-right:1.5px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:24px 20px 20px;border-bottom:1.5px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:#404942;display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font:700 13px/1.2 "DM Sans",Inter,sans-serif;color:var(--ink2)}
.brand b+b{color:var(--green)}
nav{flex:1;padding:16px 12px;overflow:auto}
.sec{padding:0 8px;font:800 10px/15px Inter;letter-spacing:.8px;text-transform:uppercase;color:var(--green);margin-bottom:2px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;margin-top:2px;border-radius:8px;color:var(--soft);text-decoration:none;font-size:13.5px}
.nav a svg{opacity:.7}
.nav a.on{background:var(--mint);color:var(--green);font-weight:600}
.nav a.on svg{opacity:1}
.nav a.on::before{content:"";position:absolute;left:0;top:10px;width:3px;height:20px;background:var(--green);border-radius:0 3px 3px 0}
.nav a:hover:not(.on){background:var(--cell-off)}
.logout{border-top:1.5px solid var(--line);padding:16px 12px}
.logout button{width:100%;display:flex;gap:10px;align-items:center;padding:8px;border:0;border-radius:8px;background:var(--mint);color:var(--green);font:600 13.5px Inter;cursor:pointer}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:60px;margin-top:4px;background:var(--card);border-bottom:1.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 1px 2px rgba(2,55,36,.05);gap:16px}
header h1{margin:0;font:700 17px/25px "DM Sans",Inter,sans-serif;color:var(--ink2)}
.hr{display:flex;align-items:center;gap:16px}
.search{position:relative;width:240px}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{width:100%;height:38px;padding:0 16px 0 36px;border:1.5px solid var(--line);border-radius:8px;background:var(--cell-off);color:var(--ink);font:13px Inter}
.search input::placeholder{color:var(--muted);opacity:.7}
.user{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#023724,#0a6244);color:#fff;display:grid;place-items:center;font:700 12px Inter}
.user b{display:block;font:600 13px/15.6px Inter;color:var(--ink2)}
.user small{display:block;font-size:11px;color:var(--muted)}
main{padding:24px 28px;flex:1}
.grid{display:grid;grid-template-columns:minmax(0,732px) minmax(280px,360px);gap:24px;max-width:1116px;margin:0 auto;align-items:stretch}
.card{background:var(--card);border:1.25px solid var(--line);border-top-width:3.75px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1.25px solid var(--line)}
.ch h2{margin:0;font:600 16px/24px Inter}
.ch p{margin:2px 0 0;color:var(--muted)}
.sel{position:relative}
.sel select{appearance:none;height:40px;padding:0 36px 0 12px;border:1.25px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:14px Inter;cursor:pointer}
.sel svg{position:absolute;right:12px;top:12px;pointer-events:none;color:var(--muted)}
.body{padding:24px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.bar h3{margin:0;font:600 18px/28px Inter}
.btns{display:flex;gap:8px}
.btn{height:32px;padding:0 12px;border:1.25px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:600 12px Inter;cursor:pointer;display:grid;place-items:center}
.btn:hover{background:var(--cell-off)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1.25px solid var(--line);border-radius:8px;overflow:hidden}
.dow{background:var(--mint2);color:var(--green2);font:600 12px/16px Inter;text-align:center;padding:8px 0}
.cell{background:var(--card);min-height:96px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:stretch;border:0;text-align:left;color:var(--ink);font-family:inherit;cursor:pointer}
.cell:hover{background:var(--cell-off)}
.cell.off{background:var(--cell-off);cursor:default}
.cell.end{background:var(--cell-end);cursor:default}
.cell.sel-d{background:var(--mint2)}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px Inter;flex:none}
.cell.today .num{background:var(--green2);color:#fff}
.chip{background:var(--chip);color:var(--green2);border-radius:4px;padding:2px 6px;font:500 11px/16.5px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.next{margin-top:12px;border-top:1.25px solid var(--line);padding-top:16px}
.next h4{margin:0 0 8px;font:600 12px/16px Inter;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px;border-radius:8px;width:100%;border:0;background:none;font:14px Inter;color:var(--ink);cursor:pointer;text-align:left}
.row:hover{background:var(--cell-off)}
.row span:last-child{color:var(--muted);white-space:nowrap}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0}
.ev i{font-style:normal;background:var(--chip);color:var(--green2);border-radius:4px;padding:2px 8px;font:500 12px Inter}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:20px 8px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
@media(max-width:760px){
  .side{display:none}
  header{padding:0 16px}.search{display:none}.user div{display:none}
  main{padding:16px 12px}.body{padding:12px}.ch{padding:12px 14px;flex-wrap:wrap}
  .cell{min-height:64px;padding:4px}.chip{font-size:0;padding:0;height:6px;width:6px;border-radius:50%;background:var(--green2);align-self:flex-start}
}

a.user{text-decoration:none;color:inherit}
.pt{max-width:1164px;margin:0 auto 16px}
.pt h2{margin:0;font:700 20px/30px "DM Sans",Inter,sans-serif;color:var(--ink2)}
.pt p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.wrap{max-width:1164px;margin:0 auto}
.stats{display:grid;gap:16px;margin-bottom:20px}
.sc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sc .n{font:700 24px/32px Inter,sans-serif}
.sc .l{margin-top:4px;font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1.25px solid var(--line);border-top-width:3.75px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}
.pch{padding:16px 24px;border-bottom:1.25px solid var(--line)}
.pch h3{margin:0;font:600 16px/24px Inter}.pch p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font:600 13px Inter;opacity:0;transition:.25s;pointer-events:none}
.msg.on{opacity:1}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip2{height:28px;padding:0 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);font:500 12.5px Inter;cursor:pointer}
.chip2.on{border-color:var(--green);background:var(--mint);color:var(--green);font-weight:700}
.an{display:flex;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.pa{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px Inter;flex:none}
.ab2{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:#94a3b8}
.meta b{color:#64748b;font-weight:600}
.tag{border-radius:99px;padding:1px 10px;font:600 11px/17px Inter}
.tag.Jadwal{background:var(--mint2);color:var(--green)}.tag.Lomba{background:#f3e8ff;color:#9333ea}.tag.Umum{background:#e0f2fe;color:#0369a1}.tag.Penting{background:#fee2e2;color:#b91c1c}
.an h4{margin:6px 0 4px;font:700 14.5px/21px Inter;color:var(--ink2)}
.an p{margin:0;font-size:13px;line-height:20px;color:#475569}
.ft{display:flex;gap:18px;align-items:center;margin-top:10px;font-size:12px}
.cc{display:inline-flex;gap:5px;align-items:center;color:#94a3b8}
.tg{border:0;background:none;color:var(--green);font:600 12px Inter;cursor:pointer;padding:0}
.cm{margin-top:10px;border-top:1.25px solid var(--line);padding-top:10px}
.ci{font-size:12.5px;color:#475569;padding:4px 0}.ci b{color:var(--ink2);margin-right:6px}
.cf{display:flex;gap:8px;margin-top:8px}
.cf input{flex:1;height:34px;padding:0 12px;border:1.25px solid var(--line);border-radius:8px;font:13px Inter;background:var(--cell-off);color:var(--ink)}
.cf button{height:34px;padding:0 14px;border:0;border-radius:8px;background:var(--green);color:#fff;font:600 12.5px Inter;cursor:pointer}
.bell{position:relative;background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center;width:32px;height:32px}
.bell i{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#ef4444}
.empty2{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><b>SMA TRISULA PRAJA</b><b>EKSTRAKURIKULER</b></div>
    </div>
    <nav class="nav">
      <div class="sec">Menu Utama</div>
      <a href="dashboard-siswa.html" data-i="grid">Dashboard</a>
      <a href="daftar-ekskul.html" data-i="list">Daftar Ekskul</a>
      <a href="jadwal.html" data-i="cal">Jadwal</a>
      <a href="tugas.html" data-i="clip">Tugas</a>
      <a href="absensi.html" data-i="user">Absensi</a>
      <a href="pengumuman.html" class="on" data-i="brief">Pengumuman</a>
      <a href="penilaian.html" data-i="bar">Penilaian</a>
    </nav>
    <div class="logout"><button type="button" onclick="location.href='login.html'"><span data-i="out"></span>Keluar</button></div>
  </aside>
  <div class="main">
    <header>
      <h1>Pengumuman</h1>
      <div class="hr">
        <div class="search"><span data-i="search"></span><input type="text" placeholder="Cari Pengumuman, Tugas..." aria-label="Cari"></div>
        <button type="button" class="bell" aria-label="Notifikasi" id="bell"><i></i></button>
        <a class="user" href="profil.html"><div class="av">BS</div><div><b>Budi Setiawan</b><small>Kelas XI IPA 2</small></div></a>
      </div>
    </header>
    <main>
      <div class="pt"><h2>Pengumuman</h2><p id="cnt"></p></div>
      <div class="wrap">
        <div class="chips" id="chips"></div>
        <div id="list"></div>
      </div>
    </main>
    <footer>Portal Ekstrakurikuler © 2026 · SMA Trisula Praja</footer>
  </div>
</div>
<div class="msg" id="msg"></div>
<script>
const ICONS={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  bar:'<path d="M12 20V10M18 20V4M6 20v-4"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  down:'<path d="m6 9 6 6 6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',check:'<path d="M20 6 9 17l-5-5"/>',up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
};
const svg=(n,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(el=>{
  const n=el.dataset.i, big=el.classList.contains('btn')||n==='down'?16:(n==='search'?15:18);
  el.insertAdjacentHTML('afterbegin',svg(n,big));
});
document.getElementById('logo').innerHTML=svg('shield',22);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const m=$('msg');m.textContent=t;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),2200);}

// Data contoh – ganti dengan data dari API/database
const A=[
  {a:'Pembina Basket',av:'PB',c:'#f97316',w:'2 jam yang lalu',k:'Jadwal',t:'Jadwal Latihan Pekan Ini',b:'Latihan akan dilaksanakan Senin & Rabu pukul 15.30–17.00 di lapangan utama. Semua anggota wajib hadir dan membawa perlengkapan lengkap.',cm:[{n:'Andi',t:'Siap kak, hadir.'},{n:'Sinta',t:'Boleh bawa sepatu futsal?'}]},
  {a:'Ketua OSIS',av:'KO',c:'#8b5cf6',w:'5 jam yang lalu',k:'Lomba',t:'Persiapan Lomba Seni Antar Sekolah',b:'Pendaftaran peserta lomba seni dibuka hingga 25 September. Segera daftarkan diri kalian ke sekretariat OSIS sebelum batas waktu.',cm:[{n:'Rina',t:'Daftar lewat siapa kak?'}]},
  {a:'Pembina Teater',av:'PT',c:'#06b6d4',w:'1 hari yang lalu',k:'Jadwal',t:'Perubahan Jadwal Latihan Teater',b:'Latihan hari Jumat dipindahkan ke Sabtu pukul 09.00 karena ruang aula dipakai untuk ujian tengah semester.',cm:[]}
];
const CATS=['Semua','Jadwal','Lomba','Umum','Penting'];
let f='Semua';const open=new Set();
function render(){
  $('chips').innerHTML=CATS.map(c=>`<button type="button" class="chip2 ${c===f?'on':''}" data-c="${c}">${c}</button>`).join('');
  const L=A.map((x,i)=>({...x,i})).filter(x=>f==='Semua'||x.k===f);
  $('cnt').textContent=L.length+' pengumuman tersedia';
  $('list').innerHTML=L.length?L.map(x=>`<article class="an"><div class="pa" style="background:${x.c}">${x.av}</div><div class="ab2">
    <div class="meta"><b>${x.a}</b><span>·</span><span>${x.w}</span><span class="tag ${x.k}">${x.k}</span></div>
    <h4>${esc(x.t)}</h4><p>${esc(x.b)}</p>
    <div class="ft"><span class="cc">${svg('msg',13)}${x.cm.length} komentar</span><button type="button" class="tg" data-t="${x.i}">${open.has(x.i)?'▲ Sembunyikan':'▼ Lihat komentar'}</button></div>
    ${open.has(x.i)?`<div class="cm">${x.cm.map(m=>`<div class="ci"><b>${esc(m.n)}</b>${esc(m.t)}</div>`).join('')||'<div class="ci">Belum ada komentar.</div>'}
      <div class="cf"><input id="in${x.i}" placeholder="Tulis komentar…" aria-label="Komentar"><button type="button" data-s="${x.i}">Kirim</button></div></div>`:''}
  </div></article>`).join(''):'<div class="empty2">Tidak ada pengumuman pada kategori ini.</div>';
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c){f=c.dataset.c;render();return;}
  const t=e.target.closest('[data-t]');if(t){const i=+t.dataset.t;open.has(i)?open.delete(i):open.add(i);render();return;}
  const s=e.target.closest('[data-s]');if(s){const i=+s.dataset.s,v=$('in'+i).value.trim();if(!v)return;A[i].cm.push({n:'Budi',t:v});render();toast('Komentar terkirim');}
});
$('bell').onclick=()=>{document.querySelector('.bell i').remove();toast('Tidak ada notifikasi baru');};
render();

</script>
</body>
</html>
