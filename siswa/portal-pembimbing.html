 var t=isV?'<div class="th">'+L(37,'NAMA SISWA')+L(234,'KELAS')+L(326,'EKSTRAKURIKULER')+L(502,'TENGGAT DAFTAR')+L(689,'STATUS')+L(842,'AKSI')+'</div>'
        :'<div class="th g">'+L(37,'NAMA SISWA')+C(290,'KELAS')+C(501,'EKSTRAKURIKULER')+L(696,'STATUS')+'</div>';
 list.forEach(function(x,i){
  var ix=(isV?p.pending:p.active).indexOf(x),cls='rw'+(isV&&i==0?' n':'');
  if(isV){
   var m=x.s==='m',col=m?'#d97706':'#dc2626';
   t+='<div class="'+cls+'">'+L(37,'<b>'+x.n+'</b>')+C(255.5,x.k)+C(389,ek)+C(560.5,'10 Okt 2026','red')
    +'<i class="dt" style="left:670px;background:'+col+'"></i>'+L(688,'<b style="color:'+col+'">'+(m?'Menunggu':'Ditolak')+'</b>')
    +(m?'<button class="ab ok" data-a="ok" data-i="'+ix+'" style="left:806px">Terima</button><button class="ab no" data-a="no" data-i="'+ix+'" style="left:892px">Tolak</button>':'')+'</div>';
  }else{
   t+='<div class="'+cls+'">'+L(37,'<b>'+x.n+'</b>')+C(290,x.k)+C(501,ek)
    +'<i class="dt" style="left:696px;background:#0ea5c6"></i>'+L(710,'<b style="color:#0ea5c6">Aktif</b>')
    +'<button class="ab no" data-a="kelola" data-i="'+ix+'" style="left:855px">Kelola</button></div>';
  }
 });
 if(!list.length)t+='<div class="rw n" style="height:51px"><span class="cl" style="left:50%;transform:translate(-50%,-50%)">'+(isV?'Tidak ada pendaftar.':'Tidak ada anggota.')+'</span></div>';
 $('tbl').innerHTML=t;
 $('mc').style.height=(148+$('tbl').offsetHeight+26)+'px';
}
function accept(x){var p=P();p.pending.splice(p.pending.indexOf(x),1);if(!p.active.some(function(a){return a.n===x.n}))p.active.push({n:x.n,k:x.k})}
function modal(x){
 var s=stat(x.n),ini=x.n.split(' ').slice(0,2).map(function(w){return w[0]}).join('').toUpperCase();
 $('md').innerHTML='<div class="md"><p style="left:24px;top:22px;font:600 15px Inter,sans-serif">Profil Anggota</p>'
 +'<button id="mx" style="left:464px;top:20px;width:24px;height:24px;border:0;background:none;font-size:20px;color:#6b7280;padding:0">&times;</button>'
 +'<div style="left:0;top:65px;width:512px;height:1px;background:#e5e7eb"></div>'
 +'<div style="left:24px;top:90px;width:56px;height:56px;border-radius:50%;background:#0f5132;color:#fff;font:600 16px Inter,sans-serif;display:grid;place-items:center">'+ini+'</div>'
 +'<p style="left:96px;top:96px;font:600 18px Inter,sans-serif">'+x.n+'</p>'
 +'<p style="left:96px;top:121px;font:14px Inter,sans-serif;color:#6b7280;white-space:nowrap">'+x.k+' · '+(cur===0?'Robotic &amp; IoT':EK[cur][0])+' Club</p>'
 +'<div class="sc" style="left:24px">Bergabung<b>'+s[0]+'</b></div><div class="sc" style="left:183px">Kehadiran<b>'+s[1]+'</b></div><div class="sc" style="left:342px">Tugas Dikumpul<b>'+s[2]+'</b></div>'
 +'<div style="left:0;top:253px;width:512px;height:73px;background:#f9fafb;border-top:1px solid #e5e7eb"></div>'
 +'<button id="mk" style="left:302px;top:270px;width:100px;border:0;background:#fecaca;color:#dc2626">Keluarkan</button>'
 +'<button id="mt" style="left:415px;top:270px;width:73px;border:1px solid #e5e7eb;background:#fff;color:#111">Tutup</button></div>';
 $('md').style.display='block';
 var close=function(){$('md').style.display='none'};
 $('mx').onclick=close;$('mt').onclick=close;
 $('md').onclick=function(e){if(e.target===$('md'))close()};
 $('mk').onclick=function(){var a=P().active;a.splice(a.indexOf(x),1);close();drawPanel()};
}
$('tv').addEventListener('click',function(){tab='v';F={q:'',k:'',s:'m'};drawPanel()});
$('ta').addEventListener('click',function(){tab='a';F={q:'',k:'',s:'m'};drawPanel()});
$('mc').addEventListener('input',function(e){if(e.target.id==='fq'){F.q=e.target.value;drawRows()}});
$('mc').addEventListener('change',function(e){
 if(e.target.id==='fk'){F.k=e.target.value;drawRows()}
 if(e.target.id==='fs'){F.s=e.target.value;drawRows()}
});
$('mc').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 var p=P();
 if(b.id==='rs'){F={q:'',k:'',s:'m'};drawPanel();return}
 if(b.id==='all'){p.pending.filter(function(x){return x.s==='m'}).forEach(accept);drawPanel();return}
 var a=b.getAttribute('data-a'),x=(tab==='v'?p.pending:p.active)[+b.getAttribute('data-i')];
 if(!x)return;
 if(a==='ok'){accept(x);drawPanel()}
 if(a==='no'){x.s='d';drawPanel()}
 if(a==='kelola')modal(x);
});

function fit(){var k=box.clientWidth/1440;S.style.transform='scale('+k+')';box.style.height=(1024*k)+'px'}
addEventListener('resize',fit);fit();
