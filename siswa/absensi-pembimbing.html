<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi · Pembimbing | Portal Ekstrakurikuler</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500&family=Carlito:wght@400;700&family=Concert+One&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pb-layout.css">
<style>
body{margin:0;background:#f7f9fb;font-family:Calibri,Carlito,sans-serif;color:#000}
.tabs{display:inline-flex;gap:8px;padding:7px 11px;background:#fff;border-radius:14px}
.tab{padding:5px 10px;border:0;border-radius:10px;background:none;font:inherit;font-size:16px;cursor:pointer}
.tab[aria-selected="true"]{background:#f9e470}
.panel{margin-top:36px;background:#fff;border-radius:14px;overflow:hidden;padding-bottom:20px}
.panel-head{background:#013020;color:#fff;padding:19px 21px 14px}
.panel-head h1{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.panel-head p{margin:0;font-size:16px;line-height:1.3}
.box{margin:32px 35px 0;border:1px solid #757575;border-radius:14px;overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse;font:400 14px system-ui,'Segoe UI',sans-serif}
th{background:#e8f5e9;color:#004029;font-weight:400;text-align:left;padding:12px 25px;height:41px}
td{padding:9px 25px;height:53px;border-top:1px solid #757575}
.c{text-align:center}
td.nm{font-weight:700}
td.kl{color:#615f5f;text-align:center}
.opts{display:flex;gap:19px;justify-content:center}
.opt{width:76px;height:33px;border:1px solid #000;border-radius:12px;background:#fff;color:#000;font:700 14px system-ui,'Segoe UI',sans-serif;cursor:pointer;transition:background .15s,color .15s}
.opt:hover{background:#eef6f1}
.opt[aria-pressed="true"]{background:#0f5132;border-color:#0f5132;color:#fff}
.save-row{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin:20px 16px 0}
.msg{font:400 14px Inter,sans-serif;color:#0f5132}
.msg.err{color:#b91c1c}
.save{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:173px;height:36px;border:0;border-radius:12px;background:#0f5132;color:#fff;font:400 16px Calibri,Carlito,sans-serif;cursor:pointer}
.save:hover{background:#013020}
.save svg{width:20px;height:20px}
td.st{text-align:center;font-weight:700;color:#615f5f}
[hidden]{display:none!important}
@media(max-width:900px){.box{margin:24px 12px 0}}
</style>
</head>
<body>

<aside id="pb-sidebar" data-active="absensi"></aside>

<div class="pb-main">
  <header id="pb-topbar"></header>
  <main id="app" class="pb-page">
    <div class="tabs" role="tablist" aria-label="Mode absensi">
      <button class="tab" role="tab" id="tab-input" aria-selected="true" aria-controls="v-input" type="button">Input Presensi</button>
      <button class="tab" role="tab" id="tab-rekap" aria-selected="false" aria-controls="v-rekap" type="button">Rekap Anggota</button>
    </div>

    <section class="panel" id="v-input" role="tabpanel" aria-labelledby="tab-input">
      <div class="panel-head"><h1>Input Presensi</h1><p>Pelatihan Robotic Bersma Ahli</p></div>
      <div class="box">
        <table>
          <thead><tr><th>NAMA SISWA</th><th class="c">KELAS</th><th class="c">STATUS</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="save-row">
        <span class="msg" id="msg" role="status"></span>
        <button class="save" id="save" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Simpan Presensi</button>
      </div>
    </section>

    <section class="panel" id="v-rekap" role="tabpanel" aria-labelledby="tab-rekap" hidden>
      <div class="panel-head"><h1>Input Presensi</h1><p>Pelatihan Robotic Bersma Ahli</p></div>
      <div class="box">
        <table>
          <thead><tr><th>NAMA SISWA</th><th class="c">KELAS</th><th class="c">STATUS</th></tr></thead>
          <tbody id="recap"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="pb-foot"></div>
</div>

<script src="js/pb-layout.js"></script>
<script>
const STATUS = ['Hadir','Izin','Sakit','Alpa'];
const KEY = 'pb_absensi_robotic';

/* Data contoh (sesuai desain). Ganti dengan data dari backend bila sudah ada. */
const SISWA = [
  {nama:'Dimas Saputra',      kelas:'XII IPA 2', status:'Hadir'},
  {nama:'Agus Santoso',       kelas:'XII IPA 1', status:'Hadir'},
  {nama:'Rahayu Dwi Kartika', kelas:'XI IPS 1',  status:'Izin'},
  {nama:'Dwi Kartika',        kelas:'XII IPA 3', status:'Alpa'},
  {nama:'Randi Rahmat',       kelas:'XII IPA 2', status:'Sakit'},
  {nama:'Wahyu Firmawan',     kelas:'XI IPS 2',  status:'Hadir'}
];

/* Pulihkan presensi tersimpan (jika ada) */
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (Array.isArray(saved) && saved.length === SISWA.length) saved.forEach((st, i) => { SISWA[i].status = st; });
} catch (e) {}

const $ = id => document.getElementById(id);
const msg = $('msg');

function renderRows() {
  $('rows').replaceChildren(...SISWA.map(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="nm"></td><td class="kl"></td><td><div class="opts" role="group"></div></td>';
    tr.children[0].textContent = s.nama;
    tr.children[1].textContent = s.kelas;
    const g = tr.querySelector('.opts');
    g.setAttribute('aria-label', 'Status ' + s.nama);
    STATUS.forEach(label => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.textContent = label;
      b.setAttribute('aria-pressed', String(s.status === label));
      b.addEventListener('click', () => {
        s.status = label; msg.textContent = '';
        g.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      });
      g.appendChild(b);
    });
    return tr;
  }));
}

function renderRecap() {
  $('recap').replaceChildren(...SISWA.map(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="nm"></td><td class="kl"></td><td class="st"></td>';
    tr.children[0].textContent = s.nama;
    tr.children[1].textContent = s.kelas;
    tr.children[2].textContent = s.status || '-';
    return tr;
  }));
}

$('save').addEventListener('click', () => {
  const kosong = SISWA.filter(s => !s.status);
  if (kosong.length) {
    msg.className = 'msg err';
    msg.textContent = 'Pilih status untuk ' + kosong.map(s => s.nama).join(', ') + '.';
    return;
  }
  /* Kirim ke backend di sini, mis. fetch('/api/presensi', {method:'POST', body: JSON.stringify(SISWA)}) */
  try { localStorage.setItem(KEY, JSON.stringify(SISWA.map(s => s.status))); } catch (e) {}
  msg.className = 'msg'; msg.textContent = '';
  toast('Presensi tersimpan');
});

function showTab(name) {
  const input = name === 'input';
  if (!input) renderRecap();
  $('v-input').hidden = !input; $('v-rekap').hidden = input;
  $('tab-input').setAttribute('aria-selected', String(input));
  $('tab-rekap').setAttribute('aria-selected', String(!input));
}
$('tab-input').addEventListener('click', () => showTab('input'));
$('tab-rekap').addEventListener('click', () => showTab('rekap'));
document.addEventListener('pb:nav-active', () => showTab('input'));

renderRows();
renderRecap();
</script>
</body>
</html>
